<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CR Feed</title>
<style>
  :root { color-scheme: light; }
  html, body { margin:0; min-height:100%; background:#000; font-family:Arial,Helvetica,sans-serif; }
  .wrap { position:relative; width:min(100vw,430px); margin:0 auto; }
  .feed { display:block; width:100%; height:auto; }
  .hotspot {
    position:absolute;
    left:2.1%; top:9.6%;
    width:11.2%; height:5.4%;
    cursor:pointer; background:transparent; border:0; padding:0; z-index:2;
  }
  .modal {
    display:none; position:fixed; inset:0; z-index:1000;
    background:rgba(0,0,0,.38);
    align-items:flex-start; justify-content:center;
    padding:84px 14px 24px;
    box-sizing:border-box;
  }
  .modal.open { display:flex; }
  .card {
    width:min(100%,390px);
    background:#fff; color:#111;
    border-radius:10px;
    box-shadow:0 18px 50px rgba(0,0,0,.34);
    overflow:hidden;
  }
  .header { padding:14px 14px 10px; }
  .title { font-size:17px; font-weight:700; line-height:1.1; margin:0 0 6px; }
  .sub { font-size:11px; line-height:1.35; color:#333; max-width:330px; }
  .learn { color:#111; text-decoration:underline; cursor:pointer; }
  .section { border-top:1px solid #dedede; padding:11px 14px; }
  .label { font-size:10px; font-weight:700; line-height:1.1; margin-bottom:5px; }
  .value { font-size:10px; line-height:1.25; color:#222; }
  .issued { display:block; color:#666; margin-top:2px; }
  .actions { display:flex; justify-content:flex-end; padding:8px 10px 10px; border-top:1px solid #e5e5e5; }
  .close { border:0; background:#111; color:#fff; border-radius:7px; padding:7px 12px; font-size:11px; cursor:pointer; }
  @media (min-width:700px) {
    .modal { padding-top:120px; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <img class="feed" src="assets/feed.png" alt="Social media news feed">
    <button class="hotspot" aria-label="Open Content Credentials" onclick="openCC()"></button>
  </main>

  <div id="cc" class="modal" role="dialog" aria-modal="true" aria-labelledby="cc-title" aria-describedby="cc-sub" onclick="backdropClose(event)">
    <div class="card">
      <div class="header">
        <h1 class="title" id="cc-title">Content Credentials</h1>
        <div class="sub" id="cc-sub">Source or history information is available for this media. <span class="learn">Learn more</span></div>
      </div>
      <div class="section">
        <div class="label">App or device used</div>
        <div class="value">OpenAI Media Service API</div>
      </div>
      <div class="section">
        <div class="label">Issued by</div>
        <div class="value">OpenAI OpCo, LLC <span class="issued">Issued on July 20, 2026</span></div>
      </div>
      <div class="actions">
        <button class="close" onclick="closeCC()">Close</button>
      </div>
    </div>
  </div>

<script>
function openCC(){ document.getElementById('cc').classList.add('open'); }
function closeCC(){ document.getElementById('cc').classList.remove('open'); }
function backdropClose(e){ if(e.target.id==='cc') closeCC(); }
addEventListener('keydown', function(e){ if(e.key==='Escape') closeCC(); });
</script>
</body>
</html>
