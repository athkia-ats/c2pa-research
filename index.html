<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CR Feed</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="page">
    <img src="assets/page-image.png" alt="News feed">
    <button class="logo-hotspot" aria-label="Open Content Credentials"></button>
  </main>
  <div data-credentials></div>
  <script>
    fetch('assets/content-credentials.html').then(r=>r.text()).then(html=>{document.querySelector('[data-credentials]').outerHTML=html; const s=document.createElement('script'); s.src='assets/app.js'; document.body.appendChild(s);});
  </script>
</body>
</html>
