<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content Credentials Prototype</title>
<style>
  html,body{margin:0;padding:0;background:#111;min-height:100%;font-family:Arial,Helvetica,sans-serif}
  body{display:flex;justify-content:center;align-items:flex-start}
  .stage{position:relative;width:min(100vw,853px);margin:0 auto;line-height:0}
  .feed{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
  .hotspot{position:absolute;left:2.6%;top:9.4%;width:94.7%;height:7.3%;background:transparent;border:0;padding:0;cursor:pointer;z-index:3}
  .hotspot:focus-visible{outline:2px solid #5aa9ff;outline-offset:2px;border-radius:18px}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
  .backdrop.open{display:flex}
  .modal{position:relative;max-width:96vw;max-height:94vh;display:flex;align-items:center;justify-content:center}
  .detail{display:block;max-width:96vw;max-height:94vh;width:auto;height:auto;border-radius:18px;box-shadow:0 20px 80px rgba(0,0,0,.55)}
  .close{position:absolute;right:10px;top:10px;width:42px;height:42px;border:1px solid rgba(255,255,255,.45);border-radius:50%;background:rgba(10,10,10,.82);color:#fff;font-size:26px;line-height:40px;text-align:center;cursor:pointer;z-index:2}
  .close:hover{background:rgba(40,40,40,.95)}
  .hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:12px;line-height:1.3;z-index:22;pointer-events:none}
</style>
</head>
<body>
  <main class="stage" aria-label="Social feed prototype">
    <img class="feed" src="feed.png" alt="Social feed">
    <button class="hotspot" id="credentialsHotspot" aria-label="Open Content Credentials"></button>
  </main>

  <div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-label="Content Credentials details">
    <div class="modal">
      <button class="close" id="closeBtn" aria-label="Close">×</button>
      <img class="detail" src="credentials-detail.png" alt="Detailed Content Credentials history and summary">
    </div>
    <div class="hint">Click outside the panel or press Esc to close</div>
  </div>

<script>
const backdrop = document.getElementById('backdrop');
const hotspot = document.getElementById('credentialsHotspot');
const closeBtn = document.getElementById('closeBtn');
function openModal(){ backdrop.classList.add('open'); document.body.style.overflow='hidden'; closeBtn.focus(); }
function closeModal(){ backdrop.classList.remove('open'); document.body.style.overflow=''; hotspot.focus(); }
hotspot.addEventListener('click', openModal);
closeBtn.addEventListener('click', closeModal);
backdrop.addEventListener('click', e=>{ if(e.target===backdrop) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && backdrop.classList.contains('open')) closeModal(); });
</script>
</body>
</html>
